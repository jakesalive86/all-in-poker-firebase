<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>♠ Check-In - All-In Poker Club ♠</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: #0a0a0a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
      padding: 15px;
      margin: 0;
      min-height: 100vh;
    }

    /* Header */
    h1 {
      color: #d4af37;
      margin: 0 0 15px 0;
      font-size: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
    }

    /* Schedule Selector */
    .session-selector {
      margin-bottom: 15px;
      background: #111;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #333;
    }
    .session-selector label {
      display: block;
      color: #888;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .session-selector select {
      width: 100%;
      padding: 12px;
      font-size: 1.1rem;
      background: #000;
      color: #d4af37;
      border: 1px solid #444;
      border-radius: 8px;
      font-weight: 600;
    }

    /* Dual Counter Display */
    .counters-row {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    .counter-box {
      flex: 1;
      background: linear-gradient(135deg, #1a1a1a, #111);
      border: 2px solid #333;
      border-radius: 12px;
      padding: 12px 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .counter-box.active {
      border-color: #d4af37;
      background: linear-gradient(135deg, #2a2a1a, #1a1a0a);
    }
    .counter-box.active .counter-label { color: #d4af37; }
    .counter-label {
      font-size: 0.7rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .counter-main {
      font-size: 2.2rem;
      font-weight: bold;
      font-family: 'SF Mono', 'Monaco', monospace;
    }
    .counter-seated { color: #00ff88; }
    .counter-divider { color: #444; margin: 0 2px; }
    .counter-total { color: #ffa500; }
    .counter-sub {
      font-size: 0.65rem;
      color: #555;
      margin-top: 2px;
      height: 14px;
    }

    /* Input Area */
    .input-wrapper {
      position: relative;
      max-width: 500px;
      margin: 0 auto 8px auto;
    }
    .input-label {
      display: block;
      color: #d4af37;
      font-size: 1rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 10px;
      text-align: center;
    }
    input[type="text"] {
      width: 100%;
      padding: 20px 24px;
      font-size: 1.5rem;
      border-radius: 12px;
      border: 3px solid #d4af37;
      background: #1a1a1a;
      color: white;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
    }
    input[type="text"]:focus {
      border-color: #ffd700;
      outline: none;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
    }
    input[type="text"]::placeholder { color: #888; font-size: 1.2rem; }

    /* Autocomplete */
    #autocomplete-list {
      list-style: none;
      padding: 0;
      margin: 0;
      position: absolute;
      width: 100%;
      z-index: 100;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 0 0 10px 10px;
      max-height: 250px;
      overflow-y: auto;
      display: none;
    }
    .player-option {
      padding: 14px 20px;
      text-align: left;
      font-size: 1.1rem;
      border-bottom: 1px solid #252525;
      cursor: pointer;
    }
    .player-option:active { background: #252525; }
    .new-player { color: #00ff88; font-weight: 600; }
    .player-status { color: #666; font-size: 0.85rem; }

    /* Message */
    #message {
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 1rem;
    }
    .msg-success { color: #00ff88; }
    .msg-error { color: #ff4444; }
    .msg-fast { color: #00ccff; font-size: 0.8rem; margin-left: 8px; }

    /* Game Sections */
    .game-sections {
      display: flex;
      gap: 8px;
      max-width: 700px;
      margin: 0 auto;
    }
    .game-section {
      flex: 1;
      background: #111;
      border-radius: 10px;
      padding: 10px;
      border: 1px solid #222;
      min-height: 150px;
    }
    .game-section.active { border-color: #d4af37; }
    .game-section h3 {
      margin: 0 0 10px 0;
      padding-bottom: 6px;
      border-bottom: 1px solid #333;
      color: #666;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .game-section.active h3 { color: #d4af37; }

    .player-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .tag {
      background: #1a1a1a;
      padding: 6px 10px;
      border-radius: 5px;
      font-size: 0.8rem;
      border: 1px solid #333;
      cursor: pointer;
    }
    .tag:active { background: #ff4444; border-color: #ff4444; }
    .tag-new {
      border-color: #00ff88;
      background: rgba(0, 255, 136, 0.1);
    }
    .tag-syncing {
      border-color: #ffa500;
      background: rgba(255, 165, 0, 0.1);
    }
    .empty-state {
      color: #444;
      font-style: italic;
      padding: 15px;
      text-align: center;
      font-size: 0.8rem;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 20px;
      max-width: 300px;
      width: 90%;
      text-align: center;
    }
    .modal h3 { margin: 0 0 8px 0; font-size: 1rem; }
    .modal p { color: #888; margin: 0 0 15px 0; font-size: 0.9rem; }
    .modal-buttons { display: flex; gap: 8px; }
    .modal-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    .modal-btn-cancel { background: #333; color: #fff; }
    .modal-btn-confirm { background: #ff4444; color: #fff; }

    /* Theme Banner */
    .theme-banner {
      max-width: 500px;
      margin: 0 auto 15px auto;
      padding: 10px 15px;
      background: linear-gradient(135deg, #4a1a6b, #2a1a4b);
      border: 1px solid #8b4fc7;
      border-radius: 8px;
      color: #e0b0ff;
      font-size: 1rem;
      font-weight: 600;
    }
    .theme-banner::before {
      content: '🎭 ';
    }

    /* Firebase Status Indicator */
    .firebase-status {
      position: fixed;
      top: 10px;
      right: 10px;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: bold;
    }
    .firebase-status.connected {
      background: rgba(0, 255, 136, 0.2);
      color: #00ff88;
      border: 1px solid #00ff88;
    }
    .firebase-status.disconnected {
      background: rgba(255, 68, 68, 0.2);
      color: #ff4444;
      border: 1px solid #ff4444;
    }
  </style>
</head>
<body>

  <div class="firebase-status" id="firebaseStatus">CONNECTING...</div>

  <h1>♠ ALL-IN POKER CLUB ♠</h1>
  <p style="text-align: center; color: #666; font-size: 0.85rem; margin: -10px 0 15px 0;">🂡 Player Check-In Kiosk 🂡</p>
  <div class="theme-banner" id="themeBanner" style="display:none;"></div>

  <div class="session-selector">
    <label>Current Event</label>
    <select id="eventSelect" onchange="onEventChange()">
      <option>Loading schedule...</option>
    </select>
  </div>

  <!-- Dual Counters -->
  <div class="counters-row">
    <div class="counter-box active" id="counter1" onclick="setGame(1)">
      <div class="counter-label">Game 1</div>
      <div class="counter-main">
        <span class="counter-seated" id="g1Seated">0</span>
        <span class="counter-divider">/</span>
        <span class="counter-total" id="g1Total">0</span>
      </div>
      <div class="counter-sub" id="g1Sub"></div>
    </div>
    <div class="counter-box" id="counter2" onclick="setGame(2)">
      <div class="counter-label">Game 2</div>
      <div class="counter-main">
        <span class="counter-seated" id="g2Seated">0</span>
        <span class="counter-divider">/</span>
        <span class="counter-total" id="g2Total">0</span>
      </div>
      <div class="counter-sub" id="g2Sub"></div>
    </div>
  </div>

  <div class="input-wrapper">
    <label class="input-label">Enter Your Name to Check In</label>
    <input type="text" id="search" placeholder="Start typing your name..." autocomplete="off">
    <ul id="autocomplete-list"></ul>
  </div>

  <div id="message"></div>

  <div class="game-sections">
    <div class="game-section active" id="section1">
      <h3>Game 1 Players</h3>
      <div class="player-list" id="game1List">
        <div class="empty-state">No players yet</div>
      </div>
    </div>
    <div class="game-section" id="section2">
      <h3>Game 2 Players</h3>
      <div class="player-list" id="game2List">
        <div class="empty-state">No players yet</div>
      </div>
    </div>
  </div>

  <!-- Removal Modal -->
  <div class="modal-overlay" id="removeModal">
    <div class="modal">
      <h3>Remove Check-In?</h3>
      <p id="removeModalText">Remove this player?</p>
      <div class="modal-buttons">
        <button class="modal-btn modal-btn-cancel" onclick="closeRemoveModal()">Cancel</button>
        <button class="modal-btn modal-btn-confirm" onclick="confirmRemove()">Remove</button>
      </div>
    </div>
  </div>

<script type="module">
  // ============================================
  // FIREBASE IMPORTS
  // ============================================
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
  import {
    getFirestore,
    collection,
    addDoc,
    deleteDoc,
    doc,
    query,
    where,
    orderBy,
    onSnapshot,
    serverTimestamp,
    getDocs
  } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

  // ============================================
  // CONFIGURATION
  // ============================================
  import { firebaseConfig, GAS_API_URL } from './firebase-config.js';
  const SYNC_INTERVAL = 30000;

  // ============================================
  // FIREBASE INITIALIZATION
  // ============================================
  let db;
  let isFirebaseReady = false;
  let unsubscribeCheckins = null;

  try {
    const app = initializeApp(firebaseConfig);
    db = getFirestore(app);
    isFirebaseReady = firebaseConfig.apiKey !== "YOUR_API_KEY";

    if (isFirebaseReady) {
      document.getElementById('firebaseStatus').textContent = 'FIREBASE';
      document.getElementById('firebaseStatus').className = 'firebase-status connected';
    } else {
      document.getElementById('firebaseStatus').textContent = 'DEMO MODE';
      document.getElementById('firebaseStatus').className = 'firebase-status disconnected';
    }
  } catch (err) {
    console.error("Firebase init error:", err);
    document.getElementById('firebaseStatus').textContent = 'OFFLINE';
    document.getElementById('firebaseStatus').className = 'firebase-status disconnected';
  }

  // ============================================
  // STATE
  // ============================================
  let masterList = [];
  let game1Data = { checkedIn: [], rsvpList: [], checkedInCount: 0, rsvpPending: 0, totalExpected: 0 };
  let game2Data = { checkedIn: [], rsvpList: [], checkedInCount: 0, rsvpPending: 0, totalExpected: 0 };
  let activeGame = 1;
  let currentDate = "";
  let currentLocation = "";
  let currentTheme = "";
  let scheduleData = [];
  let removeTarget = null;
  let removeGameNum = null;
  let removeDocId = null;

  // ============================================
  // INITIALIZATION
  // ============================================
  window.onload = function() {
    loadSchedule();
    loadMasterList();

    // Auto switch to Game 2 after 8pm
    if (new Date().getHours() >= 20) setGame(2);

    const input = document.getElementById('search');
    input.addEventListener('input', () => showSuggestions(input.value));
    input.addEventListener('focus', () => showSuggestions(input.value));

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.input-wrapper')) {
        document.getElementById('autocomplete-list').style.display = 'none';
      }
    });

    // Still poll GAS for RSVP data (reads from sheets)
    setInterval(refreshRsvpStats, SYNC_INTERVAL);
  };

  window.setGame = function(n) {
    activeGame = n;
    document.getElementById('counter1').classList.toggle('active', n === 1);
    document.getElementById('counter2').classList.toggle('active', n === 2);
    document.getElementById('section1').classList.toggle('active', n === 1);
    document.getElementById('section2').classList.toggle('active', n === 2);
    document.getElementById('search').placeholder = `Check in for Game ${n}...`;
  };

  // ============================================
  // SCHEDULE
  // ============================================
  function loadSchedule() {
    fetch(GAS_API_URL + "?action=getSchedule")
      .then(r => r.json())
      .then(data => {
        scheduleData = data || [];
        const select = document.getElementById('eventSelect');
        select.innerHTML = "";

        if (!data || data.length === 0) {
          select.innerHTML = '<option>No games scheduled</option>';
          return;
        }

        const todayStr = new Date().toLocaleDateString();
        let selectedIndex = 0;

        data.forEach((game, index) => {
          const opt = document.createElement('option');
          opt.value = index;

          let label = `${game.date} - ${game.location}`;
          if (game.type && game.type !== "Regular") label += ` (${game.type})`;
          opt.innerText = label;
          select.appendChild(opt);

          if (datesMatch(game.date, todayStr)) selectedIndex = index;
        });

        select.selectedIndex = selectedIndex;
        onEventChange();
      })
      .catch(err => {
        console.error("Failed to load schedule:", err);
        document.getElementById('eventSelect').innerHTML = '<option>Error loading schedule</option>';
      });
  }

  window.onEventChange = function() {
    const index = parseInt(document.getElementById('eventSelect').value);
    if (isNaN(index) || !scheduleData[index]) return;

    const game = scheduleData[index];
    currentDate = game.date;
    currentLocation = game.location;
    currentTheme = game.theme || "";

    const banner = document.getElementById('themeBanner');
    if (currentTheme) {
      banner.innerText = currentTheme;
      banner.style.display = 'block';
    } else {
      banner.style.display = 'none';
    }

    // Setup real-time listener for this event
    setupRealtimeListener();
    refreshRsvpStats();
  };

  function datesMatch(d1, d2) {
    const c1 = String(d1).replace(/\b0/g, "").trim();
    const c2 = String(d2).replace(/\b0/g, "").trim();
    return c1 === c2 || c1.includes(c2) || c2.includes(c1);
  }

  // ============================================
  // REAL-TIME LISTENER (Firestore)
  // ============================================
  function setupRealtimeListener() {
    // Unsubscribe from previous listener
    if (unsubscribeCheckins) {
      unsubscribeCheckins();
    }

    if (!isFirebaseReady || !currentDate) return;

    const q = query(
      collection(db, "checkins"),
      where("date", "==", currentDate),
      where("venue", "==", currentLocation),
      orderBy("timestamp", "desc")
    );

    unsubscribeCheckins = onSnapshot(q, (snapshot) => {
      // Clear current data
      game1Data.checkedIn = [];
      game2Data.checkedIn = [];

      snapshot.forEach((doc) => {
        const data = doc.data();
        const entry = {
          name: data.player,
          gameNumber: data.gameNum,
          docId: doc.id,
          synced: data.syncedToSheets
        };

        if (data.gameNum === 1) {
          game1Data.checkedIn.push(entry);
        } else if (data.gameNum === 2) {
          game2Data.checkedIn.push(entry);
        }
      });

      game1Data.checkedInCount = game1Data.checkedIn.length;
      game2Data.checkedInCount = game2Data.checkedIn.length;

      updateDisplay();
    }, (err) => {
      console.error("Realtime listener error:", err);
    });
  }

  // ============================================
  // DATA LOADING
  // ============================================
  function loadMasterList() {
    fetch(GAS_API_URL + "?action=getPlayerList")
      .then(r => r.json())
      .then(data => { masterList = data || []; })
      .catch(err => console.error("Failed to load player list:", err));
  }

  function refreshRsvpStats() {
    if (!currentDate) return;

    // Get RSVP data from GAS (still reads from sheets)
    fetch(`${GAS_API_URL}?action=getDailyStats&date=${encodeURIComponent(currentDate)}&location=${encodeURIComponent(currentLocation)}`)
      .then(r => r.json())
      .then(data => {
        const g1 = data.game1 || {};
        const g2 = data.game2 || {};

        game1Data.rsvpList = g1.rsvpList || [];
        game1Data.rsvpPending = g1.rsvpPending || 0;
        game1Data.totalExpected = game1Data.checkedInCount + game1Data.rsvpPending;

        game2Data.rsvpList = g2.rsvpList || [];
        game2Data.rsvpPending = g2.rsvpPending || 0;
        game2Data.totalExpected = game2Data.checkedInCount + game2Data.rsvpPending;

        updateDisplay();
      })
      .catch(err => console.error("RSVP refresh failed:", err));
  }

  function updateDisplay() {
    document.getElementById('g1Seated').innerText = game1Data.checkedInCount;
    document.getElementById('g1Total').innerText = game1Data.totalExpected;
    document.getElementById('g1Sub').innerText = game1Data.rsvpPending > 0 ? `${game1Data.rsvpPending} on the way` : '';

    document.getElementById('g2Seated').innerText = game2Data.checkedInCount;
    document.getElementById('g2Total').innerText = game2Data.totalExpected;
    document.getElementById('g2Sub').innerText = game2Data.rsvpPending > 0 ? `${game2Data.rsvpPending} on the way` : '';

    renderPlayerList('game1List', game1Data.checkedIn, 1);
    renderPlayerList('game2List', game2Data.checkedIn, 2);
  }

  function renderPlayerList(containerId, players, gameNum) {
    const container = document.getElementById(containerId);

    if (!players || players.length === 0) {
      container.innerHTML = '<div class="empty-state">No players yet</div>';
      return;
    }

    container.innerHTML = '';
    players.forEach((player, index) => {
      const tag = document.createElement('span');
      tag.className = 'tag';
      if (index === 0) tag.classList.add('tag-new');
      if (player.synced === false) tag.classList.add('tag-syncing');
      tag.innerText = player.name;
      tag.onclick = () => promptRemove(player.name, gameNum, player.docId);
      container.appendChild(tag);
    });
  }

  // ============================================
  // CHECK-IN (Writes to Firestore!)
  // ============================================
  window.checkIn = async function(name) {
    const msg = document.getElementById('message');
    const input = document.getElementById('search');
    const dropdown = document.getElementById('autocomplete-list');

    input.value = '';
    dropdown.style.display = 'none';

    const currentData = activeGame === 1 ? game1Data : game2Data;

    // Check for duplicate
    if (currentData.checkedIn.some(p => p.name.toLowerCase() === name.toLowerCase())) {
      msg.innerHTML = `<span class="msg-error">⚠️ ${name} already in Game ${activeGame}</span>`;
      setTimeout(() => msg.innerHTML = '', 3000);
      return;
    }

    const startTime = performance.now();

    if (isFirebaseReady) {
      try {
        // ====== WRITE TO FIRESTORE (Fast!) ======
        const docRef = await addDoc(collection(db, "checkins"), {
          player: name,
          venue: currentLocation,
          gameNum: activeGame,
          date: currentDate,
          timestamp: serverTimestamp(),
          syncedToSheets: false
        });

        const elapsed = Math.round(performance.now() - startTime);
        msg.innerHTML = `<span class="msg-success">✓ ${name} → Game ${activeGame}</span><span class="msg-fast">${elapsed}ms</span>`;
        setTimeout(() => msg.innerHTML = '', 3000);

        // Realtime listener will update the UI automatically!

        // Also add to master list if new player
        if (!masterList.some(p => p.toLowerCase() === name.toLowerCase())) {
          masterList.push(name);
        }

      } catch (err) {
        console.error("Firestore check-in failed:", err);
        msg.innerHTML = `<span class="msg-error">Error: ${err.message}</span>`;

        // Fallback to GAS
        fallbackToGAS(name);
      }
    } else {
      // Demo mode / Firebase not configured - use GAS directly
      fallbackToGAS(name);
    }
  };

  function fallbackToGAS(name) {
    const msg = document.getElementById('message');
    const currentData = activeGame === 1 ? game1Data : game2Data;

    // Optimistic update
    currentData.checkedIn.unshift({ name: name, gameNumber: activeGame });
    currentData.checkedInCount++;
    currentData.totalExpected++;
    updateDisplay();

    msg.innerHTML = `<span class="msg-success">✓ ${name} → Game ${activeGame}</span>`;
    setTimeout(() => msg.innerHTML = '', 3000);

    fetch(GAS_API_URL, {
      method: "POST",
      body: JSON.stringify({
        action: "checkin",
        player: name,
        date: currentDate,
        gameNumber: activeGame,
        location: currentLocation
      })
    })
    .then(r => r.json())
    .then(res => {
      loadMasterList();
    })
    .catch(err => console.error("GAS check-in failed:", err));
  }

  // ============================================
  // REMOVAL
  // ============================================
  window.promptRemove = function(name, gameNum, docId) {
    removeTarget = name;
    removeGameNum = gameNum;
    removeDocId = docId;
    document.getElementById('removeModalText').innerText = `Remove ${name} from Game ${gameNum}?`;
    document.getElementById('removeModal').classList.add('active');
  };

  window.closeRemoveModal = function() {
    document.getElementById('removeModal').classList.remove('active');
    removeTarget = null;
    removeGameNum = null;
    removeDocId = null;
  };

  window.confirmRemove = async function() {
    if (!removeTarget || !removeGameNum) return;

    const name = removeTarget;
    const gameNum = removeGameNum;
    const docId = removeDocId;
    closeRemoveModal();

    if (isFirebaseReady && docId) {
      try {
        // Delete from Firestore
        await deleteDoc(doc(db, "checkins", docId));
        // Realtime listener will update UI

        // Also tell GAS to remove (background)
        fetch(GAS_API_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "removeCheckin",
            player: name,
            date: currentDate,
            gameNumber: gameNum
          })
        }).catch(err => console.error("GAS remove failed:", err));

      } catch (err) {
        console.error("Firestore remove failed:", err);
      }
    } else {
      // Fallback to GAS
      const currentData = gameNum === 1 ? game1Data : game2Data;
      const idx = currentData.checkedIn.findIndex(p => p.name === name);
      if (idx >= 0) {
        currentData.checkedIn.splice(idx, 1);
        currentData.checkedInCount--;
        currentData.totalExpected--;
      }
      updateDisplay();

      fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "removeCheckin",
          player: name,
          date: currentDate,
          gameNumber: gameNum
        })
      }).catch(err => console.error("GAS remove failed:", err));
    }
  };

  // ============================================
  // AUTOCOMPLETE
  // ============================================
  window.showSuggestions = function(val) {
    const list = document.getElementById('autocomplete-list');
    list.innerHTML = '';

    if (!val) { list.style.display = 'none'; return; }

    const searchVal = val.toLowerCase();
    const matches = masterList.filter(p => p.toLowerCase().includes(searchVal)).slice(0, 8);

    matches.forEach(name => {
      const item = document.createElement('li');
      item.className = 'player-option';

      const inG1 = game1Data.checkedIn.some(p => p.name.toLowerCase() === name.toLowerCase());
      const inG2 = game2Data.checkedIn.some(p => p.name.toLowerCase() === name.toLowerCase());

      let html = name;
      if (inG1 || inG2) {
        let status = [];
        if (inG1) status.push('G1 ✓');
        if (inG2) status.push('G2 ✓');
        html += ` <span class="player-status">(${status.join(', ')})</span>`;
      }

      item.innerHTML = html;
      item.onclick = (e) => { e.stopPropagation(); checkIn(name); };
      list.appendChild(item);
    });

    const exactMatch = masterList.some(p => p.toLowerCase() === searchVal);
    if (!exactMatch && val.trim().length > 0) {
      const item = document.createElement('li');
      item.className = 'player-option new-player';
      item.innerText = `+ Add New: "${val.trim()}"`;
      item.onclick = (e) => { e.stopPropagation(); checkIn(val.trim()); };
      list.appendChild(item);
    }

    list.style.display = matches.length > 0 || !exactMatch ? 'block' : 'none';
  };
</script>
</body>
</html>
