<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>♠ Leaderboard - All-In Poker Club ♠</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: transparent;
      color: #333;
      margin: 0;
      padding: 10px;
    }

    .widget-container {
      background-color: #0a0a0a;
      color: #ffffff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      max-width: 600px;
      margin: 0 auto;
    }

    /* Header */
    .widget-header {
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid #222;
    }
    .widget-title {
      color: #d4af37;
      font-size: 1.3rem;
      margin: 0 0 5px 0;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
    }
    .widget-subtitle {
      color: #666;
      font-size: 0.8rem;
    }

    /* Firebase Badge */
    .firebase-badge {
      display: inline-block;
      background: #ff6b6b;
      color: white;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.6rem;
      vertical-align: middle;
      margin-left: 8px;
    }

    /* Venue Toggle */
    .venue-toggle {
      flex: 1;
      padding: 10px 20px;
      background: #1a1a1a;
      border: 2px solid #333;
      border-radius: 8px;
      color: #888;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.9rem;
    }
    .venue-toggle:hover {
      background: #222;
      border-color: #444;
    }
    .venue-toggle.active {
      background: linear-gradient(135deg, #2a2a1a, #1a1a0a);
      border-color: #d4af37;
      color: #d4af37;
    }

    /* Tabs */
    .tabs {
      display: flex;
      border-bottom: 2px solid #222;
      margin-bottom: 15px;
    }
    .tab {
      flex: 1;
      padding: 12px;
      cursor: pointer;
      font-weight: 600;
      color: #555;
      border-bottom: 3px solid transparent;
      text-align: center;
      transition: all 0.2s;
      font-size: 0.9rem;
    }
    .tab:hover { color: #888; }
    .tab.active {
      color: #ffa500;
      border-bottom-color: #ffa500;
    }

    /* Search */
    .search-box {
      width: 100%;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #111;
      color: white;
      font-size: 1rem;
      margin-bottom: 15px;
    }
    .search-box:focus {
      outline: none;
      border-color: #ffa500;
    }
    .search-box::placeholder { color: #555; }

    /* Table */
    table {
      width: 100%;
      border-collapse: collapse;
    }
    thead th {
      text-align: left;
      color: #666;
      font-size: 0.75rem;
      padding: 10px 8px;
      border-bottom: 1px solid #333;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }
    thead th:last-child {
      text-align: right;
    }
    tbody tr {
      transition: background 0.15s;
    }
    tbody tr:hover {
      background: #1a1a1a;
    }
    td {
      padding: 14px 8px;
      border-bottom: 1px solid #1a1a1a;
      font-size: 0.95rem;
    }

    /* Rank Column */
    .rank-cell {
      width: 50px;
    }
    .rank-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.9rem;
      background: #1a1a1a;
      color: #666;
    }

    /* Top 3 Ranks */
    .rank-1 .rank-badge {
      background: linear-gradient(135deg, #FFD700, #FFA500);
      color: #000;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
    }
    .rank-2 .rank-badge {
      background: linear-gradient(135deg, #C0C0C0, #A0A0A0);
      color: #000;
    }
    .rank-3 .rank-badge {
      background: linear-gradient(135deg, #CD7F32, #B87333);
      color: #000;
    }

    /* Player Name */
    .player-name {
      font-weight: 500;
    }
    .rank-1 .player-name { color: #FFD700; }
    .rank-2 .player-name { color: #C0C0C0; }
    .rank-3 .player-name { color: #CD7F32; }

    /* Qualified indicator (game winner) */
    .qualified-badge {
      display: inline-block;
      background: linear-gradient(135deg, #28a745, #218838);
      color: #fff;
      font-size: 0.65rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .qualified-row {
      background: rgba(40, 167, 69, 0.1);
    }
    .qualified-row:hover {
      background: rgba(40, 167, 69, 0.2);
    }

    /* Points Column */
    .points-cell {
      text-align: right;
      font-weight: 600;
      font-family: 'SF Mono', Monaco, monospace;
    }
    .points-value { color: #ffa500; }
    .bounty-value { color: #ff4444; }

    /* Loading & Empty States */
    .loading, .empty-state {
      text-align: center;
      color: #555;
      padding: 40px 20px;
    }
    .loading::after {
      content: '';
      animation: dots 1.5s infinite;
    }
    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60%, 100% { content: '...'; }
    }

    /* Stats Summary */
    .stats-summary {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
    }
    .stat-card {
      flex: 1;
      background: #111;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
    }
    .stat-value {
      font-size: 1.8rem;
      font-weight: bold;
      color: #d4af37;
      font-family: 'SF Mono', Monaco, monospace;
    }
    .stat-label {
      font-size: 0.7rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 5px;
    }

    /* Last Updated */
    .last-updated {
      text-align: center;
      font-size: 0.75rem;
      color: #444;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #222;
    }
  </style>
</head>
<body>

<div class="widget-container">
  <div class="widget-header">
    <h1 class="widget-title">♠ ALL-IN POKER CLUB ♠ <span class="firebase-badge">FIREBASE</span></h1>
    <div class="widget-subtitle">🂡 Season Leaderboard 🂡</div>
    <div style="text-align: center; margin-top: 10px; color: #ffa500; font-size: 0.9rem; font-weight: 600;" id="championshipDate">
      Championship: Loading...
    </div>
  </div>

  <!-- Venue Toggle -->
  <div style="display: flex; gap: 10px; margin-bottom: 15px; justify-content: center;">
    <button class="venue-toggle active" id="venueTightEnd" onclick="switchVenue('Tight End')">Tight End</button>
    <button class="venue-toggle" id="venueWildCorgi" onclick="switchVenue('Wild Corgi')">Wild Corgi</button>
  </div>

  <div class="stats-summary">
    <div class="stat-card">
      <div class="stat-value" id="totalPlayers">-</div>
      <div class="stat-label">Players</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="totalBounties">-</div>
      <div class="stat-label">Bounties</div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('league')">🏆 Points</div>
    <div class="tab" onclick="switchTab('bounty')">💀 Bounties</div>
  </div>

  <input type="text" id="search" class="search-box" placeholder="Search player..." onkeyup="renderTable()">

  <div id="loading" class="loading">Loading rankings</div>

  <table id="rankings-table" style="display:none;">
    <thead>
      <tr>
        <th>#</th>
        <th>Player</th>
        <th id="scoreHeader">Points</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>

  <div id="empty-state" class="empty-state" style="display:none;">
    No players found
  </div>

  <div class="last-updated">
    Last updated: <span id="updateTime">-</span>
  </div>
</div>

<script type="module">
  import { firebaseConfig, GAS_API_URL, isFirebaseConfigured } from './firebase-config.js';

  // ============================================
  // CONFIGURATION
  // ============================================
  // Leaderboard is READ-ONLY, so it just uses GAS API for now
  // In Phase 3, this could read from Firestore for faster loads
  const API_URL = GAS_API_URL;

  // ============================================
  // STATE
  // ============================================
  let leagueData = [];
  let bountyData = [];
  let currentTab = 'league';
  let currentVenue = 'Tight End';
  let championshipDate = '';

  // Make functions globally available
  window.switchVenue = switchVenue;
  window.switchTab = switchTab;
  window.renderTable = renderTable;

  // ============================================
  // INITIALIZATION
  // ============================================
  loadStandings();

  function loadStandings() {
    fetch(API_URL + "?action=getLeaderboard&venue=" + encodeURIComponent(currentVenue))
      .then(r => r.json())
      .then(data => {
        leagueData = data.league || [];
        bountyData = data.bounties || [];
        championshipDate = data.championshipDate || 'TBD';

        // Update championship date display
        document.getElementById('championshipDate').innerText = 'Championship: ' + championshipDate;

        // Update stats
        updateStats();

        // Hide loading, show table
        document.getElementById('loading').style.display = 'none';
        document.getElementById('rankings-table').style.display = 'table';

        // Update timestamp
        document.getElementById('updateTime').innerText = new Date().toLocaleString();

        renderTable();
      })
      .catch(err => {
        document.getElementById('loading').innerText = 'Failed to load standings';
        console.error(err);
      });
  }

  function updateStats() {
    // Count only players with points > 0 (have played this season)
    const activePlayers = leagueData.filter(p => p.points > 0).length;
    document.getElementById('totalPlayers').innerText = activePlayers;

    const totalBounty = bountyData.reduce((sum, p) => sum + (p.bounties || 0), 0);
    document.getElementById('totalBounties').innerText = totalBounty;
  }

  // ============================================
  // VENUE SWITCHING
  // ============================================

  function switchVenue(venue) {
    currentVenue = venue;

    // Update button UI
    document.querySelectorAll('.venue-toggle').forEach(btn => btn.classList.remove('active'));
    if (venue === 'Tight End') {
      document.getElementById('venueTightEnd').classList.add('active');
    } else {
      document.getElementById('venueWildCorgi').classList.add('active');
    }

    // Reload data for new venue
    loadStandings();
  }

  // ============================================
  // TAB SWITCHING
  // ============================================

  function switchTab(tab) {
    currentTab = tab;

    // Update tab UI
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');

    // Update header
    document.getElementById('scoreHeader').innerText = tab === 'league' ? 'Points' : 'Bounties';

    renderTable();
  }

  // ============================================
  // RENDERING
  // ============================================

  function renderTable() {
    const tbody = document.getElementById('table-body');
    const searchTerm = document.getElementById('search').value.toLowerCase();
    const data = currentTab === 'league' ? leagueData : bountyData;

    // Filter by search
    const filtered = data.filter(p =>
      p.name.toLowerCase().includes(searchTerm)
    );

    // Handle empty state
    if (filtered.length === 0) {
      tbody.innerHTML = '';
      document.getElementById('empty-state').style.display = 'block';
      return;
    }

    document.getElementById('empty-state').style.display = 'none';

    // Build table rows
    let html = '';
    filtered.forEach((player, index) => {
      const rank = index + 1;
      const rankClass = rank <= 3 ? `rank-${rank}` : '';
      const qualifiedClass = player.qualified ? 'qualified-row' : '';
      const qualifiedBadge = player.qualified ? '<span class="qualified-badge">Qualified</span>' : '';

      const scoreValue = currentTab === 'league'
        ? `<span class="points-value">${Math.round(player.points).toLocaleString()}</span>`
        : `<span class="bounty-value">${player.bounties} 💀</span>`;

      html += `
        <tr class="${rankClass} ${qualifiedClass}">
          <td class="rank-cell">
            <span class="rank-badge">${rank}</span>
          </td>
          <td class="player-name">${escapeHtml(player.name)}${qualifiedBadge}</td>
          <td class="points-cell">${scoreValue}</td>
        </tr>
      `;
    });

    tbody.innerHTML = html;
  }

  // ============================================
  // HELPERS
  // ============================================

  function formatNumber(num) {
    if (num >= 1000) {
      return (num / 1000).toFixed(1) + 'k';
    }
    return num.toString();
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>

</body>
</html>
